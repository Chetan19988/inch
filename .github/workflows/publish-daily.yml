name: Publish One Page Daily

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  SITE_URL: "https://howlongisinch.com" # Replace with your real domain

jobs:
  publish-page:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move Draft and Update Sitemap
        run: |
          # Works with either _draft or _drafts
          DRAFT_DIR="_draft"
          [ -d "_drafts" ] && DRAFT_DIR="_drafts"

          if [ -d "$DRAFT_DIR" ] && [ "$(ls -A $DRAFT_DIR/*.html 2>/dev/null)" ]; then
            NEXT_FILE=$(ls $DRAFT_DIR/*.html | head -n 1)
            FILENAME=$(basename "$NEXT_FILE")
            TODAY=$(date -u +"%Y-%m-%d")

            echo "Publishing: $FILENAME"

            git mv "$NEXT_FILE" "./$FILENAME"

            if [ -f "sitemap.xml" ]; then
              NEW_ENTRY="  <url>\n    <loc>${SITE_URL}/${FILENAME}</loc>\n    <lastmod>${TODAY}</lastmod>\n    <priority>0.8</priority>\n  </url>"
              sed -i "/<\/urlset>/i \\${NEW_ENTRY}" sitemap.xml
              git add sitemap.xml
            fi

            if [ -z "$(ls -A $DRAFT_DIR 2>/dev/null)" ]; then
              rmdir "$DRAFT_DIR"
            fi

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Auto-published: $FILENAME and updated sitemap.xml"
            git push
          else
            echo "No draft pages found to publish."
          fi
